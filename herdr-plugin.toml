# Herdr plugin manifest for Herdr Palette. Requires Herdr >= 0.7.0 plugin support.
# Cross-reference: README.md and https://github.com/ramarivera/herdr-palette
id = "ramarivera.palette"
name = "Herdr Palette"
version = "0.1.10"
min_herdr_version = "0.7.0"
description = "A Raycast/Linear-style fuzzy command palette for Herdr."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open palette"
contexts = ["workspace", "tab", "pane", "global"]
command = [
  "herdr",
  "plugin",
  "pane",
  "open",
  "--plugin",
  "ramarivera.palette",
  "--entrypoint",
  "overlay",
  "--placement",
  "overlay",
  "--focus",
]

[[actions]]
id = "shell"
title = "Open palette shell"
contexts = ["workspace", "tab", "pane", "global"]
command = [
  "herdr",
  "plugin",
  "pane",
  "open",
  "--plugin",
  "ramarivera.palette",
  "--entrypoint",
  "shell",
  "--placement",
  "overlay",
  "--focus",
]

[[panes]]
id = "overlay"
title = "Palette"
placement = "overlay"
# GitHub installs run the build command above and leave the binary in the
# managed checkout, and herdr runs pane commands with the plugin root as cwd.
# The leading `./` is required: herdr resolves a bare relative argv[0] through
# $PATH, so `target/release/herdr-palette` fails to spawn on a GitHub install.
# Cross-reference: cargo/herdr-plugin.toml for the cargo installed binary flow.
command = ["./target/release/herdr-palette"]

[[panes]]
id = "shell"
title = "Palette Shell"
placement = "overlay"
# GitHub installs run the build command above and leave the binary in the
# managed checkout, and herdr runs pane commands with the plugin root as cwd.
# The leading `./` is required: herdr resolves a bare relative argv[0] through
# $PATH, so `target/release/herdr-palette` fails to spawn on a GitHub install.
# Cross-reference: cargo/herdr-plugin.toml for the cargo installed binary flow.
command = ["./target/release/herdr-palette", "--shell"]
